plugins {
    id 'java'
    // com.github.johnrengelman.shadow is archived/unmaintained and breaks under Gradle 9's
    // internals; com.gradleup.shadow is its actively-maintained continuation (same task names,
    // same "shadowJar" config API).
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'com.asharpminer.wps'
// Minecraft/Spigot dropped the "1." version prefix as of the 2026 releases (26.1, 26.2, ...) -
// this is genuinely "26.2", not "1.26.2".
version = '26.2'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url 'https://oss.sonatype.org/content/groups/public/' }
    maven { url 'https://repo.papermc.io/repository/maven-public/' } // for paper-api (test fixture, see below)
}

// MockBukkit ships as a Paper-API-backed mock server; its own module doesn't pull in paper-api
// itself, so it must be added alongside it (must be kept in step with the mockbukkit-v26.1.2
// artifact's own "Paper-Version" manifest entry when bumping mockbukkitVersion below).
//
// NOTE: MockBukkit doesn't have a v26.2 branch yet as of this writing, only v26.1.2 - one
// version behind the plugin's actual spigot-api target below. Bump mockbukkitArtifact to
// mockbukkit-v26.2 (and paperApiVersion to match) once that branch exists upstream.
def mockbukkitArtifact = 'mockbukkit-v26.1.2'
def paperApiVersion = '26.1.2.build.72-stable'
def mockbukkitVersion = '4.115.0'
def junitVersion = '6.1.3'

dependencies {
    // Provided by the server at runtime - not bundled into the plugin jar.
    compileOnly "org.spigotmc:spigot-api:${version}-R0.1-SNAPSHOT"

    // Discord bot library - bundled into the plugin jar by shadowJar (mirrors the old
    // build.xml's <zipgroupfileset> of lib/JDA-*-withDependencies-min.jar). Voice/audio
    // support is excluded since WPS only ever sends text notifications.
    implementation('net.dv8tion:JDA:5.1.0') {
        exclude group: 'club.minnced', module: 'opus-java'
    }

    testImplementation "io.papermc.paper:paper-api:${paperApiVersion}"
    testImplementation "org.mockbukkit.mockbukkit:${mockbukkitArtifact}:${mockbukkitVersion}"
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Test-only dependencies (MockBukkit / paper-api) target newer bytecode than the plugin itself
// (Minecraft's server jar requires Java 25+ as of this release); this bumps only the test source
// set so the production jar keeps targeting Java 17. Pinning an explicit JDK 25 toolchain here
// (rather than relying on whatever JVM happens to launch Gradle) keeps this working regardless
// of a developer's default JDK - Gradle auto-detects/auto-provisions it as needed.
tasks.named('compileTestJava', JavaCompile) {
    options.release = 25
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.named('test', Test) {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Match the plugin jar naming the old Ant build produced: WoolfPostalService-<version>.jar
shadowJar {
    archiveClassifier.set('')
    archiveFileName.set("${project.name}-${version}.jar")
    // Several of JDA's transitive kotlin-stdlib jars carry inert *.kotlin_module metadata
    // (Kotlin-compiler-only, unused by our all-Java code); excluding it sidesteps shadow's
    // duplicate-handling warning for these instead of merging meaningless duplicates.
    exclude 'META-INF/*.kotlin_module'
}

tasks.withType(Jar).configureEach {
    manifest {
        attributes(
            'Built-By': System.getProperty('user.name'),
            'Built-Date': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        )
    }
}

tasks.named('build') {
    dependsOn shadowJar
}

tasks.withType(JavaCompile).configureEach {
    options.deprecation = true
    options.debug = true
}
